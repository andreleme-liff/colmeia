<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LIFF Ops — sistema de gestão de atividades</title>

<!-- Design system LIFF: fontes, tokens e base -->
<link rel="stylesheet" href="_ds/liff-design-system-064c9d4d-2b53-487d-bb38-ec3256a6c7cb/styles.css">
<link rel="stylesheet" href="app.css">

<!-- Aplica o tema antes do primeiro paint, senão a página pisca no fundo errado. -->
<script>
(() => {
  let theme;
  try { theme = localStorage.getItem('liff-ops-theme'); } catch (e) { /* storage bloqueado */ }
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<!-- Componentes do design system (dependem do React global) -->
<script src="_ds/liff-design-system-064c9d4d-2b53-487d-bb38-ec3256a6c7cb/_ds_bundle.js"></script>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
