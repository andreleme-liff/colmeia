# Build do LIFF tasks no AWS Amplify Hosting.
#
# A plataforma tem que ser WEB_COMPUTE, não WEB: este app é SSR de verdade — rotas de API,
# sessão em cookie, permissão avaliada no servidor. Em WEB (estático) nada disso sobe, e o
# sintoma é a aplicação carregar a tela e todo /api devolver 404.
#
# ATENÇÃO — Next.js 16 não está na faixa suportada: a documentação da Amplify diz
# "versions 12 through 15". Este arquivo é o necessário, não o suficiente. Ver README.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm ci` e não `npm install`: respeita o package-lock e falha se ele divergir do
        # package.json, em vez de resolver uma árvore diferente da que foi testada aqui.
        - npm ci
    build:
      commands:
        # PRIMEIRO o typegen, e não é opcional. `RouteContext` e `PageProps` não existem no
        # código-fonte: o Next os GERA em `.next/types`, e `.next` é gitignored. Num clone
        # limpo — que é exatamente o caso aqui — o `tsc` abaixo falha com onze
        # "Cannot find name 'RouteContext'" se o typegen não rodar antes.
        - npx next typegen
        # O typecheck roda ANTES do build. O `next build` não falha por erro de tipo em
        # toda configuração, e um deploy que sobe com tipo quebrado é pior que um que não
        # sobe: o erro aparece em runtime, num request de usuário.
        - npx tsc --noEmit
        - npx eslint .
        # Testes que não precisam de banco. Os do contrato cobrem o extenso em português,
        # que é o que prevalece juridicamente se divergir do algarismo.
        - node --experimental-strip-types scripts/verificar-contrato.mjs
        - npm run build
  artifacts:
    # Saída do adaptador de SSR da Amplify para Next.js. Não é `.next` nem `out`.
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
